[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-will-fix-it-gridwise"
version = "0.1.0"
description = "LLM-assisted Smart Campus Energy Optimization — BUP CSE Fest 2026 Hackathon preliminary"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Team Ai-Will-Fix-It" }
]
keywords = ["llm", "optimization", "energy", "hackathon", "bup-cse-fest-2026"]

# Runtime deps mirror requirements.txt for pip-install-from-source.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pulp>=2.7.0",
    "scipy>=1.11.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
