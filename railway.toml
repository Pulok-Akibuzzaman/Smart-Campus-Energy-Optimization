# Railway deployment configuration for GridWise.
#
# Railway auto-detects Python when it sees `runtime.txt` + `Procfile`.
# This file pins the build/deploy behaviour and makes the healthcheck explicit.
#
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"        # Use the project's Dockerfile (faster than nixpacks here)
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn gridwise.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30       # seconds — first request boots PuLP/scipy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
